name: Flutter CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install the project's Flutter SDK revision
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin ac4e799d237041cf905519190471f657b657155a
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Show SDK versions
        run: flutter --version
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage
      - name: Build web release
        run: flutter build web --release
